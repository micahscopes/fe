[package]
name = "classic-quilting-artifact-abi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "export-classic-quilting-fixtures"
path = "src/bin/export_classic_quilting_fixtures.rs"
required-features = ["quilting-export"]

[features]
default = []
quilting-export = ["dep:quilting-core", "dep:serde", "dep:serde_json"]
fe-oracle = [
    "quilting-export",
    "dep:common",
    "dep:driver",
    "dep:fe-codegen",
    "dep:hir",
    "dep:url",
    "dep:wasmparser",
    "dep:wasmtime",
]

[dependencies]
quilting-core = { path = "../../../../quilting/crates/quilting-core", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
common = { package = "fe-common", path = "../../../fe-worktrees/mb2/crates/common", optional = true }
driver = { package = "fe-driver", path = "../../../fe-worktrees/mb2/crates/driver", optional = true }
fe-codegen = { path = "../../../fe-worktrees/mb2/crates/codegen", default-features = false, optional = true }
hir = { package = "fe-hir", path = "../../../fe-worktrees/mb2/crates/hir", features = ["testutils"], optional = true }
url = { version = "2.5.4", optional = true }
wasmparser = { version = "0.248.0", optional = true }
wasmtime = { version = "44.0.1", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
