<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23202544'/%3E%3Cpath d='M14 45V19h36v7H23v4h22v7H23v8z' fill='%23ffb8de'/%3E%3C/svg%3E">
<title>Fe Event Studio</title>
<style>
  :root { color-scheme: dark; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center;
         background: #11131d; color: #f5edff; font: 14px/1.5 system-ui, sans-serif; }
  #event-studio { display: block; width: min(560px, calc(100vw - 32px)); border-radius: 10px;
                  background: linear-gradient(145deg, #202544, #292449 54%, #3a294b);
                  box-shadow: inset 0 1px #ffffff12, 0 18px 60px #0008; }
  .event-studio-panel { padding: 28px; }
  h2 { margin: 0 0 6px; color: #ffd9f2; }
  .event-studio-copy { margin: 0 0 20px; color: #c9c8eb; }
  .event-studio-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .event-studio-grid p { margin: 0; padding: 12px 14px; border: 1px solid #ffffff12;
                         border-radius: 7px; background: #11142666; color: #aaaad1; }
  .event-studio-grid strong { color: #ffb8de; }
  @media (max-width: 480px) { .event-studio-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <fe-component id="event-studio"></fe-component>
  <script type="application/fe" data-fe-src="sketches/event_studio/src/lib.fe"
          data-fe-component data-fe-mount="#event-studio"></script>
</body>
</html>
