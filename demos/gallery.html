<!doctype html>
<!--
  The canonical all-demos page. `fe web dev demos/gallery.html` compiles and
  renders every sketch without authored browser JavaScript. One inert
  `data-fe-page` script names the Fe page actor; its typed const projection
  generates render/component declarations, captions, links, and DOM structure
  before the generated bootstrap and fixed, demo-blind hosts mount the
  corresponding custom elements. The render host drives surface lifecycle
  (poster first, live on pointer intent, suspended off-viewport) while sharing a
  single WebGPU device across every tile (acquireSharedGpu). See
  crates/codegen/assets/render-runtime/fe-render-runtime.js and
  FE_WEB_V5_ORCHESTRATION_DESIGN.md section 3/6 for the element/lifecycle.

  This is the sole gallery source. The former `gallery/index.html` Trunk page
  was retired after its unique examples were either promoted to this Fe page
  or retained as explicitly separate legacy showcases.

  `data-fe-entry` is OMITTED on purpose: the entry is derived from each sketch's
  `actor` declaration (Cga3dSurface, QcgaSurface, ...), never guessed here.

  No `data-fe-width`/`data-fe-height` either: every sketch below declares a
  `const fn view()` (protocol v5), CTFE-projected into the manifest `surface`
  section, so the runtime reads the real dispatch extent from there. The page
  carries no sizes at all (FE_WEB_V5_ORCHESTRATION_DESIGN.md).

  Each caption carries a content-addressed source asset; the runtime's meta line
  links the generated wgsl/wasm/manifest. The enclosing resident Fe
  SourceInspector owns selection, loading, stale-response, and presentation
  policy for all four artifact kinds.

  Tile restyling uses `fe-surface::part(...)` (canvas/panel/control/badge/meta)
  instead of piercing the runtime's internal layout with `!important`: the
  element's shadow DOM is not reachable any other way, which is the point (R2
  retires the old override hack this file used to carry).

  The canonical qcga pencil tile is the Fe fragment-surface DE view. Its
  solver-backed InitialState, point editing, and scheduled orbit/pencil
  controls come from the shared Fe scene ingot; the fixed host contributes
  WebGPU/DOM standards transport only. Its production visibility loop iterates
  an implicit quadric distance estimate. Analytic ray roots exist only in the
  independent Rust oracle and never enter the shipped renderer. The former
  vertex/fragment actor is retired; its radial projection survives only as a
  zero-import CPU/Wasm geometry oracle in the shared non-rendering Fe library.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fe-attribution-policy" content="canonical_fe_gallery">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312151b'/%3E%3Cpath d='M14 45V19h36v7H23v4h22v7H23v8z' fill='%235b8cff'/%3E%3C/svg%3E">
<title>fe web · gallery</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d0f13; color: #cfd6e4; padding: 24px; }
  .gallery-shell { display: block; }
  .gallery-head { max-width: 1500px; margin: 0 auto 22px; }
  .gallery-head h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; color: #e6ecf7; letter-spacing: .02em; }
  .gallery-head p { margin: 0; color: #8a93a6; font-size: 12.5px; }
  .gallery-head a { display: inline-block; margin-top: 8px; color: #91a7ca; font-size: 12.5px; }
  .gallery-head code { color: #b7c2d8; background: #171a21; padding: 1px 6px; border-radius: 4px; }
  .grid { max-width: 1500px; margin: 0 auto;
          display: grid; gap: 28px;
          grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  /* Scope tile chrome to DIRECT children so it never bleeds into the
     `<fe-surface>` element's own shadow DOM. */
  .grid > figure { margin: 0; background: #12151b; border: 1px solid #1e232d;
           border-radius: 10px; padding: 12px; display: flex; flex-direction: column;
           gap: 10px; align-items: stretch;
           /* Skip compositing off-screen tiles so scrolling a page of live
              WebGPU canvases stays smooth (belt-and-suspenders alongside the
              element's own IntersectionObserver suspend/poster lifecycle,
              FE_WEB_V5_ORCHESTRATION_DESIGN.md section 6). contain-intrinsic-size
              reserves each tile's height so the scrollbar does not jump as
              tiles enter/leave. */
           content-visibility: auto; contain-intrinsic-size: auto 720px; }
  figcaption { font-size: 12.5px; color: #aeb8cc; display: flex; align-items: baseline; gap: 8px; }
  figcaption b { color: #e6ecf7; font-weight: 600; }
  figcaption .desc { flex: 1; }
  /* Unobtrusive source link. */
  figcaption a { color: #6b7688; text-decoration: underline dotted; font-size: 11.5px; }
  figcaption a:hover { color: #b7c2d8; }
  figcaption a.demo-route { color: inherit; font-size: inherit; text-decoration: none; }
  figcaption a.demo-route:hover b { text-decoration: underline; }
  /* The element already defaults to a vertical (canvas-atop-controls) layout
     that fills its box, so a gallery tile needs only ordinary box-model CSS
     on the host, no shadow-piercing `!important` hack. `::part(canvas)` is
     available for anything more than "fill the tile", e.g.
     `fe-surface::part(canvas) { border-radius: 6px; }`. */
  .grid > figure fe-surface { width: 100%; max-width: none; }
  /* Square tiles: the dispatch extent is square (512x512), so render the canvas
     1:1 instead of letting it letterbox. ::part reaches the element's shadow
     canvas; the durable fix is the runtime honoring the manifest extent aspect. */
  .grid > figure fe-surface::part(canvas) { aspect-ratio: 1 / 1; width: 100%; height: auto; }
  /* Resident Fe component example. Its reducer and DOM effect program are in
     sketches/todomvc/src/lib.fe; these scoped rules are ordinary page assets. */
  .todo-app { display: block; position: relative; overflow: hidden; background: #f5f5f5;
              color: #333; border-radius: 6px; box-shadow: 0 2px 12px #0006; }
  .todo-app button, .todo-app input { font: 14px/1.4 system-ui, sans-serif; }
  .todo-app .todo-heading { margin: 18px 0 4px; color: rgba(175, 47, 47, .25);
                            font: 100 64px/1 system-ui, sans-serif; text-align: center; }
  .todo-app .new-todo, .todo-app .edit { width: 100%; margin: 0; border: 0; outline: 0;
                                         background: white; color: #222; }
  .todo-app .new-todo { padding: 16px 16px 16px 54px; font-size: 21px;
                        box-shadow: inset 0 -2px 1px #00000008; }
  .todo-app .new-todo::placeholder { color: #ccc; font-style: italic; }
  .todo-app .main { position: relative; border-top: 1px solid #e6e6e6; background: white; }
  .todo-app .toggle-all { position: absolute; z-index: 2; top: -50px; left: 7px; width: 42px;
                          height: 46px; margin: 0; opacity: 0; cursor: pointer; }
  .todo-app .toggle-all-label { position: absolute; top: -50px; left: 7px; width: 42px; height: 46px;
                                color: #aaa; font: 28px/40px system-ui, sans-serif; text-align: center;
                                cursor: pointer; }
  .todo-app .toggle-all:checked + .toggle-all-label { color: #555; }
  .todo-app .toggle-all:focus-visible + .toggle-all-label { outline: 2px solid #8aa9d6; outline-offset: -5px; }
  .todo-app .todo-list { margin: 0; padding: 0; list-style: none; }
  .todo-app .todo-list > li { position: relative; min-height: 54px; border-bottom: 1px solid #ededed;
                              font: 20px/1.35 system-ui, sans-serif; }
  .todo-app .todo-list .view { display: flex; align-items: center; min-height: 54px; }
  .todo-app .todo-list .toggle { width: 34px; height: 34px; margin: 0 8px; }
  .todo-app .todo-list label { flex: 1; padding: 13px 8px; overflow-wrap: anywhere; }
  .todo-app .todo-list .completed label { color: #bbb; text-decoration: line-through; }
  .todo-app .edit-button, .todo-app .destroy { width: 34px; height: 38px; border: 0;
                                               background: none; cursor: pointer; }
  .todo-app .edit-button { color: #9aa5b5; font-size: 20px; }
  .todo-app .destroy { margin-right: 8px; color: #cc9a9a; font-size: 26px; }
  .todo-app .destroy::after { content: "×"; }
  .todo-app .edit { display: none; padding: 12px 14px; border: 1px solid #999; font-size: 20px; }
  .todo-app .editing .view { display: none; }
  .todo-app .editing .edit { display: block; }
  .todo-app .footer { position: relative; min-height: 48px; padding: 12px; background: white;
                      color: #777; font: 13px/1.4 system-ui, sans-serif; text-align: center; }
  .todo-app .todo-count { float: left; }
  .todo-app .filters { position: absolute; right: 0; left: 0; margin: 0; padding: 0; list-style: none; }
  .todo-app .filters li { display: inline; }
  .todo-app .filters button, .todo-app .clear-completed { border: 1px solid transparent;
                                                          background: none; color: inherit; cursor: pointer; }
  .todo-app .filters .selected { border-color: rgba(175, 47, 47, .3); border-radius: 3px; }
  .todo-app .clear-completed { position: relative; float: right; }
  .todo-app [hidden] { display: none !important; }
  .event-studio { display: block; min-height: 250px; border-radius: 8px;
                  background: linear-gradient(145deg, #202544, #292449 54%, #3a294b);
                  color: #f5edff; box-shadow: inset 0 1px #ffffff12, 0 8px 30px #0005; }
  .event-studio .event-studio-panel { padding: 24px; }
  .event-studio h2 { margin: 0 0 6px; color: #ffd9f2; font: 600 24px/1.2 system-ui, sans-serif; }
  .event-studio .event-studio-copy { margin: 0 0 20px; color: #c9c8eb;
                                      font: 14px/1.5 system-ui, sans-serif; }
  .event-studio .event-studio-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                                      gap: 10px; }
  .event-studio .event-studio-grid p { margin: 0; padding: 12px 14px; border: 1px solid #ffffff12;
                                       border-radius: 7px; background: #11142666; color: #aaaad1; }
  .event-studio .event-studio-grid strong { color: #ffb8de; font-weight: 650; }
  .source-inspector { position: fixed; z-index: 100; inset: 4vh 4vw; display: flex;
                      flex-direction: column; overflow: hidden; border: 1px solid #30394a;
                      border-radius: 10px; background: #0f1218; box-shadow: 0 24px 80px #000c; }
  .source-inspector .inspector-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
                                      border-bottom: 1px solid #252b37; background: #151922; }
  .source-inspector .inspector-title { flex: 1; font-weight: 600; color: #edf2fb; }
  .source-inspector .raw { color: #91a7ca; }
  .source-inspector .close { border: 0; background: none; color: #aeb8cc; font-size: 22px; cursor: pointer; }
  .source-inspector .inspector-body { min-height: 0; flex: 1; overflow: auto; }
  .source-inspector pre { min-height: 100%; margin: 0; padding: 16px; white-space: pre; tab-size: 2;
                          font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .source-inspector .message { padding: 24px; color: #aeb8cc; }
  .source-inspector .error { color: #ff9c9c; white-space: pre-wrap; }
  .source-inspector[hidden], .source-inspector [hidden] { display: none !important; }
  @media (max-width: 600px) {
    body { padding: 12px; }
    .gallery-head { margin-bottom: 16px; }
    .grid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .grid > figure { min-width: 0; padding: 9px; contain-intrinsic-size: auto 560px; }
    .todo-app .todo-heading { font-size: 52px; }
    .todo-app .footer { display: grid; gap: 8px; }
    .todo-app .todo-count, .todo-app .clear-completed { float: none; }
    .todo-app .filters { position: static; }
    .event-studio .event-studio-grid { grid-template-columns: 1fr; }
    .source-inspector { inset: 8px; }
  }
</style>
</head>
<body>
  <script type="application/fe" data-fe-page
          data-fe-src="sketches/gallery_page/src/lib.fe"></script>
</body>
</html>
