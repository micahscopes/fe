<!doctype html>
<!--
  The all-demos page. `fe web dev demos/gallery.html` compiles and renders
  EVERY render sketch on one page, script-free: each `<script
  type="application/fe" data-fe-render>` is a standalone render bundle, and the
  fe-render-runtime mounts one canvas per script while sharing a single WebGPU
  device across all of them (acquireSharedGpu).

  This is the standards-based successor to the Trunk gallery in `index.html`
  (which is a `data-trunk rel="copy-dir"` manifest, NOT application/fe, so
  `fe web dev index.html` renders nothing). Keep both until the Trunk lane is
  retired.

  `data-fe-entry` is OMITTED on purpose: the entry is derived from each sketch's
  `actor` declaration (Cga3dSurface, QcgaSurface, ...), never guessed here.

  `data-fe-width/height="128"` matches the `const RESOLUTION: f32 = 128.0` that
  every one of these sketches already declares (cga3d:269, desargues:42,
  plasma:17, qcga:282, mandelbrot:22, dec:743) - a shared convention, not a
  per-page guess. gradient declares no RESOLUTION and adapts to the dispatch
  size. The do-it-right that deletes even these attrs is manifest v5: project
  the actor's declared dispatch size into the manifest so the page carries no
  size at all (FE_WEB_GALLERY_ORCHESTRATION_DESIGN.md section 7). Until then
  this is the same short-term per-page fix one.html uses, applied uniformly.

  qcga_pencil is intentionally absent: it is a compute sketch with no render
  actor (it has no `shade`/GpuProgram entry), so it is not a gallery tile.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fe web · gallery</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d0f13; color: #cfd6e4; padding: 24px; }
  header { max-width: 1100px; margin: 0 auto 22px; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; color: #e6ecf7; letter-spacing: .02em; }
  header p { margin: 0; color: #8a93a6; font-size: 12.5px; }
  header code { color: #b7c2d8; background: #171a21; padding: 1px 6px; border-radius: 4px; }
  .grid { max-width: 1200px; margin: 0 auto;
          display: grid; gap: 20px;
          grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  /* Scope tile chrome to DIRECT children so it never bleeds into the runtime's
     own nested <figure class="fe-render">. */
  .grid > figure { margin: 0; background: #12151b; border: 1px solid #1e232d;
           border-radius: 10px; padding: 12px; display: flex; flex-direction: column;
           gap: 10px; align-items: stretch; }
  figcaption { font-size: 12.5px; color: #aeb8cc; }
  figcaption b { color: #e6ecf7; font-weight: 600; }
  /* Override the render runtime's side-by-side (canvas | 180-260px controls)
     grid: in a gallery tile the control column starves the canvas to a few px,
     so stack the canvas ON TOP of the controls and let it fill the tile. */
  .fe-render { grid-template-columns: 1fr !important; gap: 10px !important; }
  .fe-render canvas { max-width: 100% !important; }
</style>
</head>
<body>
  <header>
    <h1>fe web · gallery</h1>
    <p>Every render sketch, compiled and run on the GPU from its Fe source. Serve with <code>fe web dev demos/gallery.html</code>.</p>
  </header>

  <div class="grid">
    <figure>
      <figcaption><b>cga3d</b> · sparse Clifford sphere pencil</figcaption>
      <script type="application/fe" data-fe-src="sketches/cga3d" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
    <figure>
      <figcaption><b>qcga</b> · quadric conformal surface</figcaption>
      <script type="application/fe" data-fe-src="sketches/qcga" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
    <figure>
      <figcaption><b>desargues</b> · projective incidence</figcaption>
      <script type="application/fe" data-fe-src="sketches/desargues" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
    <figure>
      <figcaption><b>plasma</b> · branch-free field</figcaption>
      <script type="application/fe" data-fe-src="sketches/plasma" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
    <figure>
      <figcaption><b>mandelbrot</b> · escape-time set</figcaption>
      <script type="application/fe" data-fe-src="sketches/mandelbrot" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
    <figure>
      <figcaption><b>dec</b> · discrete exterior calculus</figcaption>
      <script type="application/fe" data-fe-src="sketches/dec" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
    <figure>
      <figcaption><b>gradient</b> · runtime-default surface</figcaption>
      <script type="application/fe" data-fe-src="sketches/gradient" data-fe-render data-fe-width="128" data-fe-height="128"></script>
    </figure>
  </div>
</body>
</html>
