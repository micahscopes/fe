<!doctype html>
<!--
  Smallest slice of the fe web gallery: one `application/fe` script tag
  naming an ingot DIRECTORY (`sketches/cga3d`), rendering under standards
  tooling (`fe web dev demos/one.html`) instead of the legacy
  `fe web build`/`fe web serve` per-demo bundle path. `data-fe-entry="shade"`
  is optional (derived from the sketch's `actor` declaration) and shown here
  only because it is reconciled, never trusted over the declaration.

  `data-fe-width`/`data-fe-height` match cga3d's baked `RESOLUTION: f32 =
  128.0` (demos/sketches/cga3d/src/lib.fe:269); the runtime's own default is
  256, which would silently stretch this sketch 2x. This is the short-term,
  per-demo-authored fix documented in FE_WEB_GALLERY_ORCHESTRATION_DESIGN.md
  section 7; the do-it-right ladder is an actor-declared dispatch size
  projected into the manifest (a v5 field), not a page-authored guess.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>fe web · one</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d0f13; color: #cfd6e4; display: grid; place-items: center;
         min-height: 100vh; gap: 18px; padding: 24px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: #e6ecf7; letter-spacing: .02em; }
</style>
</head>
<body>
  <h1>fe web · one (sketches/cga3d)</h1>
  <script type="application/fe"
          data-fe-src="sketches/cga3d"
          data-fe-entry="shade"
          data-fe-render
          data-fe-width="512"
          data-fe-height="512"></script>
</body>
</html>
