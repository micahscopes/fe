[package]
name = "fe-codegen"
version = "26.2.0"
edition.workspace = true

[dependencies]
compiler-db = { path = "../compiler-db", package = "fe-compiler-db" }
mir = { path = "../mir", package = "fe-mir" }
hir.workspace = true
common.workspace = true
fe-host-abi = { path = "../host-abi" }
hex = "0.4"
num-bigint.workspace = true
rustc-hash.workspace = true
sonatina-ir.workspace = true
sonatina-triple.workspace = true
sonatina-codegen.workspace = true
sonatina-verifier.workspace = true
smallvec.workspace = true
smallvec1.workspace = true
tracing.workspace = true
wasmparser = "0.248.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Web bundles reparse and validate emitted WGSL against the browser-default
# capability set as a production gate, rather than relying only on the
# SPIR-V backend's less restrictive internal validation.
naga = { version = "29", features = ["wgsl-in"], optional = true }

[features]
# On by default so the standard build/test carries the Fe -> SPIR-V wire
# (slice S1). Enables the naga SPIR-V backend in `sonatina-codegen`; the root
# workspace pin also turns it on, so this composes additively. When the feature
# is off (`--no-default-features`), the `BackendKind::Spirv` driver fails closed
# with a clear `UnsupportedBackend` error rather than emitting wrong bytes.
default = ["spirv-backend"]
spirv-backend = ["sonatina-codegen/spirv-backend", "dep:naga"]
# Host-only JIT support. Kept out of the default graph so browser/compiler
# builds do not pull Cranelift, native object support, or a JIT runtime.
native-backend = ["sonatina-codegen/cranelift"]
# Reviewed overlay capability. This is deliberately off by default because
# Fe's published Sonatina pin predates typed indirect-call IR/table lowering.
sonatina-indirect-calls = []

[dev-dependencies]
# The Schedule32 / QCGA3D demo examples stage a throwaway application ingot
# under output/demo-tmp via a uniquely named temp dir.
tempfile = "3"
dir-test.workspace = true
driver.workspace = true
test-utils.workspace = true
url.workspace = true
hir = { workspace = true, features = ["testutils"] }
fe-webidl-bindgen = { path = "../webidl-bindgen" }
fe-host-runtime = { path = "../host-runtime" }
# Execution harness for the Fe -> wasm acceptance test (mirrors the Sonatina
# wasm backend's own wasmtime test versions).
wasmtime = "44.0.1"
# The SPIR-V keystone (slice S2) executes the Fe-emitted shader on a real GPU
# runtime (lavapipe / software Vulkan) via wgpu, mirroring the Sonatina SPIR-V
# backend's own `mandelbrot_snapshot_spirv_gpu` test (same wgpu/pollster pins).
wgpu = { version = "29", features = ["vulkan-portability"] }
pollster = "0.4.0"
# The B2 browser-profile WGSL gate reparses the naga-emitted WGSL with the
# `wgsl-in` front end and re-validates it with `Capabilities::default()` (the
# browser-shaped capability set, NO SHADER_INT64 - sonatina itself validates
# with `Capabilities::all()`, so this is a strictly stronger independent gate).
# Same naga 29.0.4 already in the graph via wgpu, so no version fork. It is a
# normal dependency because the reusable WebBundle API performs this gate.
# The EVM leg of the S2 keystone executes the same Fe source's EVM bytecode
# under revm. This is a dev-only (test-target) dependency, so the
# codegen -> contract-harness -> codegen edge is a dev-dependency cycle, which
# Cargo permits (the lib graph stays acyclic).
fe-contract-harness = { path = "../contract-harness" }
# The Rollcall EVM test needs to build ABI calldata (Token::Uint/FixedArray)
# for a fixed-size-array contract call; fe-contract-harness already depends on
# the same version, so this adds no new resolved version to the graph.
ethers-core = "2"
# The B3 page generator (`examples/gen_webgpu_demo.rs`) serializes the
# compiler-stated `SpirvLayout` to `layout.json`. The fork carries no serde dep
# (plan ruling 1 item 5); the fe side does the serialization, here via the
# `json!` macro reading the layout fields directly.
# The MSM-0a / MSM-P field-multiply-mod-p gate needs an INDEPENDENT bigint oracle
# (a*b*R^-1 mod p) to check the Fe field-mul against. num-bigint is already a
# normal codegen dependency (already built), so re-declaring it here for the
# integration-test target adds no build cost.
num-bigint.workspace = true
