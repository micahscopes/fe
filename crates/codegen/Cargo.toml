[package]
name = "fe-codegen"
version = "26.2.0"
edition.workspace = true

[dependencies]
driver = { path = "../driver", package = "fe-driver" }
mir = { path = "../mir", package = "fe-mir" }
hir.workspace = true
common.workspace = true
hex = "0.4"
num-bigint.workspace = true
rustc-hash.workspace = true
sonatina-ir.workspace = true
sonatina-triple.workspace = true
sonatina-codegen.workspace = true
sonatina-verifier.workspace = true
smallvec.workspace = true
smallvec1.workspace = true
tracing.workspace = true

[features]
# On by default so the standard build/test carries the Fe -> SPIR-V wire
# (slice S1). Enables the naga SPIR-V backend in `sonatina-codegen`; the root
# workspace pin also turns it on, so this composes additively. When the feature
# is off (`--no-default-features`), the `BackendKind::Spirv` driver fails closed
# with a clear `UnsupportedBackend` error rather than emitting wrong bytes.
default = ["spirv-backend"]
spirv-backend = ["sonatina-codegen/spirv-backend"]

[dev-dependencies]
dir-test.workspace = true
test-utils.workspace = true
url.workspace = true
hir = { workspace = true, features = ["testutils"] }
# Execution harness for the Fe -> wasm acceptance test (mirrors the Sonatina
# wasm backend's own wasmtime test versions).
wasmtime = "44.0.1"
wasmparser = "0.248.0"
