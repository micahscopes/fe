[package]
name = "fe-codegen"
version = "26.2.0"
edition.workspace = true

[dependencies]
driver = { path = "../driver", package = "fe-driver" }
mir = { path = "../mir", package = "fe-mir" }
hir.workspace = true
common.workspace = true
hex = "0.4"
num-bigint.workspace = true
rustc-hash.workspace = true
sonatina-ir.workspace = true
sonatina-triple.workspace = true
sonatina-codegen.workspace = true
sonatina-verifier.workspace = true
smallvec.workspace = true
smallvec1.workspace = true
tracing.workspace = true

[features]
# On by default so the standard build/test carries the Fe -> SPIR-V wire
# (slice S1). Enables the naga SPIR-V backend in `sonatina-codegen`; the root
# workspace pin also turns it on, so this composes additively. When the feature
# is off (`--no-default-features`), the `BackendKind::Spirv` driver fails closed
# with a clear `UnsupportedBackend` error rather than emitting wrong bytes.
default = ["spirv-backend"]
spirv-backend = ["sonatina-codegen/spirv-backend"]

[dev-dependencies]
dir-test.workspace = true
test-utils.workspace = true
url.workspace = true
hir = { workspace = true, features = ["testutils"] }
# Execution harness for the Fe -> wasm acceptance test (mirrors the Sonatina
# wasm backend's own wasmtime test versions).
wasmtime = "44.0.1"
wasmparser = "0.248.0"
# The SPIR-V keystone (slice S2) executes the Fe-emitted shader on a real GPU
# runtime (lavapipe / software Vulkan) via wgpu, mirroring the Sonatina SPIR-V
# backend's own `mandelbrot_snapshot_spirv_gpu` test (same wgpu/pollster pins).
wgpu = { version = "29", features = ["vulkan-portability"] }
pollster = "0.4.0"
# The B2 browser-profile WGSL gate reparses the naga-emitted WGSL with the
# `wgsl-in` front end and re-validates it with `Capabilities::default()` (the
# browser-shaped capability set, NO SHADER_INT64 - sonatina itself validates
# with `Capabilities::all()`, so this is a strictly stronger independent gate).
# Same naga 29.0.4 already in the graph via wgpu, so no version fork.
naga = { version = "29", features = ["wgsl-in"] }
# The EVM leg of the S2 keystone executes the same Fe source's EVM bytecode
# under revm. This is a dev-only (test-target) dependency, so the
# codegen -> contract-harness -> codegen edge is a dev-dependency cycle, which
# Cargo permits (the lib graph stays acyclic).
fe-contract-harness = { path = "../contract-harness" }
# The B3 page generator (`examples/gen_webgpu_demo.rs`) serializes the
# compiler-stated `SpirvLayout` to `layout.json`. The fork carries no serde dep
# (plan ruling 1 item 5); the fe side does the serialization, here via the
# `json!` macro reading the layout fields directly.
serde_json = "1"
