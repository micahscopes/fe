[package]
name = "fe-compiler-protocol"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Versioned, target-neutral Fe compiler request and artifact protocol"

[dependencies]
fe-host-abi = { path = "../host-abi" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
