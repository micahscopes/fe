[package]
name = "fe-host-wasm-codec"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Platform-neutral canonical-memory codec for Fe core Wasm host interfaces"

[dependencies]
fe-host-abi = { path = "../host-abi" }
fe-host-runtime = { path = "../host-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
