<!DOCTYPE html><!--
  The all-demos page. `fe web dev demos/gallery.html` compiles and renders
  EVERY render sketch on one page, script-free: each `<script
  type="application/fe" data-fe-render>` is a standalone render bundle, and the
  bootstrap handoff inserts a `<fe-surface>` custom element after each script,
  which mounts and drives its own lifecycle (poster first, live on pointer
  intent, suspended off-viewport) while sharing a single WebGPU device across
  every tile on the page (acquireSharedGpu). See
  crates/codegen/assets/render-runtime/fe-render-runtime.js and
  FE_WEB_V5_ORCHESTRATION_DESIGN.md section 3/6 for the element/lifecycle.

  This is the standards-based successor to the Trunk gallery in `index.html`
  (which is a `data-trunk rel="copy-dir"` manifest, NOT application/fe, so
  `fe web dev index.html` renders nothing). Keep both until the Trunk lane is
  retired.

  `data-fe-entry` is OMITTED on purpose: the entry is derived from each sketch's
  `actor` declaration (Cga3dSurface, QcgaSurface, ...), never guessed here.

  No `data-fe-width`/`data-fe-height` either: every sketch below declares a
  `const fn view()` (protocol v5), CTFE-projected into the manifest `surface`
  section, so the runtime reads the real dispatch extent from there. The page
  carries no sizes at all (FE_WEB_V5_ORCHESTRATION_DESIGN.md).

  Each caption carries a `source` link (the dev server serves the raw .fe); the
  runtime's meta line links the generated wgsl/wasm/manifest.

  Tile restyling uses `fe-surface::part(...)` (canvas/panel/control/badge/meta)
  instead of piercing the runtime's internal layout with `!important`: the
  element's shadow DOM is not reachable any other way, which is the point (R2
  retires the old override hack this file used to carry).

  qcga_pencil is intentionally absent: it is the interactive vertex+fragment+drag
  actor the current fragment-only runtime cannot drive yet. It enters the gallery
  at v5 build slice R6.
--><html lang="en"><head>

<title>fe web · gallery</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d0f13; color: #cfd6e4; padding: 24px; }
  header { max-width: 1500px; margin: 0 auto 22px; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; color: #e6ecf7; letter-spacing: .02em; }
  header p { margin: 0; color: #8a93a6; font-size: 12.5px; }
  header code { color: #b7c2d8; background: #171a21; padding: 1px 6px; border-radius: 4px; }
  .grid { max-width: 1500px; margin: 0 auto;
          display: grid; gap: 28px;
          grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  /* Scope tile chrome to DIRECT children so it never bleeds into the
     `<fe-surface>` element's own shadow DOM. */
  .grid > figure { margin: 0; background: #12151b; border: 1px solid #1e232d;
           border-radius: 10px; padding: 12px; display: flex; flex-direction: column;
           gap: 10px; align-items: stretch;
           /* Skip compositing off-screen tiles so scrolling a page of live
              WebGPU canvases stays smooth (belt-and-suspenders alongside the
              element's own IntersectionObserver suspend/poster lifecycle,
              FE_WEB_V5_ORCHESTRATION_DESIGN.md section 6). contain-intrinsic-size
              reserves each tile's height so the scrollbar does not jump as
              tiles enter/leave. */
           content-visibility: auto; contain-intrinsic-size: auto 720px; }
  figcaption { font-size: 12.5px; color: #aeb8cc; display: flex; align-items: baseline; gap: 8px; }
  figcaption b { color: #e6ecf7; font-weight: 600; }
  figcaption .desc { flex: 1; }
  /* Unobtrusive source link. */
  figcaption a { color: #6b7688; text-decoration: underline dotted; font-size: 11.5px; }
  figcaption a:hover { color: #b7c2d8; }
  /* The element already defaults to a vertical (canvas-atop-controls) layout
     that fills its box, so a gallery tile needs only ordinary box-model CSS
     on the host, no shadow-piercing `!important` hack. `::part(canvas)` is
     available for anything more than "fill the tile", e.g.
     `fe-surface::part(canvas) { border-radius: 6px; }`. */
  .grid > figure fe-surface { width: 100%; max-width: none; }
  /* Square tiles: the dispatch extent is square (512x512), so render the canvas
     1:1 instead of letting it letterbox. ::part reaches the element's shadow
     canvas; the durable fix is the runtime honoring the manifest extent aspect. */
  .grid > figure fe-surface::part(canvas) { aspect-ratio: 1 / 1; width: 100%; height: auto; }
</style>
</head>

  <!-- Buildless inline code viewer (dev affordance): intercepts clicks on the
       source/wgsl/wasm/manifest links the tiles already carry (reaching into
       each <fe-surface> shadow DOM via composedPath) and shows the fetched text
       in a dialog instead of downloading. This is a STOPGAP on the dev gallery;
       the durable home is the fixed render runtime's meta line (needs a compiler
       rebuild, so it graduates there on the next build). -->
  <dialog id="fe-code-viewer">
    <div class="cv-head">
      <span class="cv-title">code</span>
      <span class="cv-bytes"></span>
      <a class="cv-raw" target="_blank" rel="noopener">raw</a>
      <button class="cv-close" type="button" aria-label="close">×</button>
    </div>
    <pre class="cv-body" tabindex="0"></pre>
  </dialog>
  <style>
    #fe-code-viewer { width: min(90vw, 1000px); max-height: 82vh; padding: 0;
      border: 1px solid #2a3140; border-radius: 10px; background: #0f1218; color: #cfd6e4;
      overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
    #fe-code-viewer::backdrop { background: rgba(4,6,10,.66); }
    #fe-code-viewer .cv-head { display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid #1e232d; background: #12151b; }
    #fe-code-viewer .cv-title { font: 600 12.5px ui-monospace, Menlo, monospace; color: #e6ecf7; }
    #fe-code-viewer .cv-bytes { font: 11.5px ui-monospace, monospace; color: #8a93a6; flex: 1; }
    #fe-code-viewer .cv-raw { font: 11.5px ui-monospace, monospace; color: #6b7688; text-decoration: underline dotted; }
    #fe-code-viewer .cv-raw:hover { color: #b7c2d8; }
    #fe-code-viewer .cv-close { background: none; border: 0; color: #8a93a6; font-size: 20px;
      line-height: 1; cursor: pointer; padding: 0 4px; }
    #fe-code-viewer .cv-close:hover { color: #e6ecf7; }
    #fe-code-viewer .cv-body { margin: 0; padding: 14px 16px; overflow: auto; max-height: calc(82vh - 44px);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfd6e4;
      white-space: pre; tab-size: 2; }
  </style>
  <script>
    (function () {
      const dlg = document.getElementById('fe-code-viewer');
      const titleEl = dlg.querySelector('.cv-title');
      const bytesEl = dlg.querySelector('.cv-bytes');
      const rawEl = dlg.querySelector('.cv-raw');
      const bodyEl = dlg.querySelector('.cv-body');
      dlg.querySelector('.cv-close').addEventListener('click', () => dlg.close());
      dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); }); // backdrop click
      const kindOf = (p) => {
        if (p.endsWith('.wgsl')) return 'wgsl';
        if (p.endsWith('.wasm')) return 'wasm';
        if (p.endsWith('.json')) return 'manifest';
        if (p.endsWith('.fe')) return 'source';
        return null;
      };
      document.addEventListener('click', async (e) => {
        const a = e.composedPath().find((n) => n && n.tagName === 'A' && n.href);
        if (!a) return;
        let path;
        try { path = new URL(a.href).pathname; } catch { return; }
        const kind = kindOf(path);
        if (!kind) return;
        e.preventDefault();
        e.stopPropagation();
        const name = path.split('/').pop();
        titleEl.textContent = kind + '  ·  ' + name;
        rawEl.href = a.href;
        bodyEl.textContent = 'loading ' + name + ' ...';
        if (!dlg.open) dlg.showModal();
        try {
          const res = await fetch(a.href);
          if (kind === 'wasm') {
            const buf = new Uint8Array(await res.arrayBuffer());
            bytesEl.textContent = buf.length + ' bytes (binary module)';
            const hex = [...buf.slice(0, 512)].map((b) => b.toString(16).padStart(2, '0'))
              .reduce((acc, h, i) => acc + h + ((i + 1) % 32 === 0 ? '\n' : ' '), '');
            bodyEl.textContent = 'compiled wasm module, ' + buf.length + ' bytes.\n'
              + 'first ' + Math.min(512, buf.length) + ' bytes:\n\n' + hex
              + (buf.length > 512 ? '\n...' : '');
          } else {
            const text = await res.text();
            bytesEl.textContent = new Blob([text]).size + ' bytes';
            bodyEl.textContent = text;
          }
        } catch (err) {
          bodyEl.textContent = 'failed to load ' + name + ': ' + err;
        }
      }, true);
    })();
  </script>
